<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <rect width="1280" height="640" fill="#141310"/>
  <rect width="1280" height="640" fill="url(#dots)" opacity="0.5"/>
  <defs>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#f2ede2" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- top border accent -->
  <rect x="0" y="0" width="1280" height="10" fill="#c9ff3d"/>

  <!-- logo + wordmark -->
  <g transform="translate(72,64)">
    <rect width="72" height="72" rx="18" fill="#f2ede2"/>
    <rect x="15" y="13" width="42" height="11" rx="5.5" fill="#141310"/>
    <rect x="24" y="29" width="24" height="7" rx="3.5" fill="#141310"/>
    <path d="M17 44h38" stroke="#141310" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M29 54l7 7 7-7" fill="none" stroke="#141310" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- acid bars inside logo -->
    <rect x="15" y="13" width="42" height="11" rx="5.5" fill="#c9ff3d"/>
    <rect x="24" y="29" width="24" height="7" rx="3.5" fill="#c9ff3d"/>
  </g>
  <text x="164" y="113" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="#f2ede2" letter-spacing="-1">pixelpress</text>
  <text x="164" y="142" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#9a958a" letter-spacing="2">BULK IMAGE COMPRESSION</text>

  <!-- headline -->
  <text x="68" y="300" font-family="Georgia, 'Times New Roman', serif" font-size="148" font-weight="600" fill="#f2ede2" letter-spacing="-8">Images,</text>
  <text x="68" y="430" font-family="Georgia, 'Times New Roman', serif" font-size="148" font-weight="600" font-style="italic" fill="#f2ede2" letter-spacing="-8">pressed.</text>
  <rect x="72" y="460" width="480" height="14" fill="#c9ff3d"/>
  <text x="72" y="525" font-family="ui-sans-serif, -apple-system, Helvetica, Arial, sans-serif" font-size="26" fill="#b8b3a6">AVIF · WebP · JPEG · PNG — globs, widths, cache.</text>
  <text x="72" y="562" font-family="ui-monospace, Menlo, monospace" font-size="19" fill="#7d786d">npx pixelpress "public/**/*.{jpg,png}" -o dist -w 480,960</text>

  <!-- right card -->
  <g transform="translate(830,90)">
    <rect width="378" height="460" rx="20" fill="#1e1c18" stroke="#3a372f" stroke-width="1.5"/>
    <text x="32" y="56" font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7d786d" letter-spacing="1">$ pixelpress hero.jpg</text>
    <g font-family="ui-monospace, Menlo, monospace" font-size="17" fill="#f2ede2">
      <text x="32" y="116">✓ hero.avif</text><text x="250" y="116" fill="#c9ff3d">87% ↓</text>
      <text x="32" y="156">✓ hero.webp</text><text x="250" y="156" fill="#c9ff3d">85% ↓</text>
      <text x="32" y="196">✓ hero-480.avif</text><text x="250" y="196" fill="#c9ff3d">91% ↓</text>
      <text x="32" y="236">✓ hero-960.webp</text><text x="250" y="236" fill="#c9ff3d">83% ↓</text>
    </g>
    <line x1="32" y1="268" x2="346" y2="268" stroke="#3a372f" stroke-width="1.5"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="15">
      <rect x="32" y="292" width="130" height="38" rx="19" fill="#c9ff3d"/><text x="52" y="316" fill="#141310">one CLI</text>
      <rect x="172" y="292" width="130" height="38" rx="19" fill="none" stroke="#4a463d" stroke-width="1.5"/><text x="192" y="316" fill="#f2ede2">one API</text>
    </g>
    <g font-family="ui-monospace, Menlo, monospace" font-size="14" fill="#7d786d">
      <text x="32" y="376">--preset web --prune</text>
      <text x="32" y="404">--manifest --picture</text>
      <text x="32" y="432">MIT · Node 22.5+</text>
    </g>
    <circle cx="352" cy="28" r="26" fill="#ff5b36"/>
    <text x="352" y="37" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#141310">✳</text>
  </g>
</svg>
